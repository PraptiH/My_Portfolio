<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .navColor {
            background-color: #fefff0;
        }

        .navContent {
            position: relative;
            width: min(50rem, 90vw);
        }

        .navBox {
            position: absolute;
            inset: 0;
            transform: translateX(-3.2rem);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            pointer-events: none;
        }

        .navBox div:nth-child(1) {
            justify-self: start;
            align-self: start;
            transform: translate(32px, -18px);
        }

        .navBox div:nth-child(2) {
            justify-self: end;
            align-self: start;
            transform: translate(70px, -18px);
        }

        .navBox div:nth-child(3) {
            justify-self: start;
            align-self: end;
            transform: translate(32px, 18px);
        }

        .navBox div:nth-child(4) {
            justify-self: end;
            align-self: end;
            transform: translate(70px, 18px);
        }

        .navBox div {
            width: 16px;
            height: 16px;
            border: 3px solid;
        }

        .navLink a {
            cursor: pointer;
            text-decoration: none;
        }

        .navLink:hover a {
            text-decoration: underline;
            text-decoration-color: burlywood;
            text-decoration-thickness: 5px;
        }
    </style>
</head>

<body>
    <div id="navbar" class="border-b-4 fixed pt-20 pb-5 top-0 z-50 w-full">
        <div class="navContent border-4 h-[5rem] mx-auto flex items-center p-[2rem] justify-between bottom-10 ">

            <div class="navBox">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>

            <div class="py-[1.5rem] flex items-center gap-2">
                <img class="w-[4rem] cursor-pointer" src="./assets/navStar.png" alt="logo" width="26">
                <h4 onclick="window.location.href='index.html'" class="font-bold text-3xl cursor-pointer">Prapti</h4>
            </div>

            <div class="border-l-3">
                <ul class="flex items-center justify-between gap-[2rem] font-medium text-2xl ">
                    <li class="navLink py-[1.5rem] ml-[1rem] px-[1rem]"><a href="index.html#about">About</a></li>
                    <li class="navLink py-[1.5rem] px-[1rem] border-l-3 border-r-3"><a
                            href="index.html#project">Project</a>
                    </li>
                    <li class="navLink py-[1.5rem]"><a href="index.html#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </div>
</body>

</html>
